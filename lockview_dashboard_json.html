<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackview Dashboard - Vehicle Lock Status Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            color: #2d3748;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header-left p {
            color: #718096;
            font-size: 15px;
        }

        .upload-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-upload-label {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-block;
        }

        .file-upload-label:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .stat-card h3 {
            color: #718096;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .stat-card .number {
            color: #2d3748;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-card .sublabel {
            color: #a0aec0;
            font-size: 13px;
        }

        .controls {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls input[type="text"],
        .controls select {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
            transition: all 0.3s;
        }

        .controls input[type="text"]:focus,
        .controls select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .controls button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .controls button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .table-header {
            padding: 24px;
            border-bottom: 2px solid #e2e8f0;
        }

        .table-header h2 {
            color: #2d3748;
            font-size: 20px;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f7fafc;
        }

        th {
            padding: 16px 20px;
            text-align: left;
            font-weight: 600;
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            color: #4a5568;
            font-size: 14px;
        }

        tbody tr {
            transition: all 0.2s;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-locked {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-unlocked {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-unknown {
            background: #e2e8f0;
            color: #4a5568;
        }

        .status-nodata {
            background: #feebc8;
            color: #7c2d12;
        }

        .vehicle-id {
            font-weight: 600;
            color: #2d3748;
        }

        .loading {
            text-align: center;
            padding: 60px 40px;
            color: #718096;
        }

        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #38a169;
        }

        .message.error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #e53e3e;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 24px;
            border-top: 2px solid #e2e8f0;
        }

        .pagination button {
            padding: 8px 16px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #4a5568;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #f7fafc;
            border-color: #667eea;
            color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination .page-info {
            color: #718096;
            font-size: 14px;
            font-weight: 500;
        }

        /* Styles for expandable timeline details */
        .vehicle-details-row {
            background-color: #fcfcfc;
        }
        .timeline-container {
            padding: 15px 20px;
            border-left: 3px solid #667eea;
            margin-left: 20px;
            position: relative;
        }
        .timeline-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dotted #e2e8f0;
        }
        .timeline-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .timeline-date {
            font-weight: 600;
            color: #4a5568;
            min-width: 160px;
            flex-shrink: 0;
        }
        .timeline-status {
            margin-left: 15px;
            flex-shrink: 0;
        }
        .timeline-message {
            margin-left: 15px;
            color: #718096;
            flex-grow: 1;
        }
        .timeline-location {
            margin-left: 15px;
            font-size: 12px;
            color: #a0aec0;
            flex-shrink: 0;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>🔒 Trackview Dashboard</h1>
                <p>Vehicle Lock Status Tracking System</p>
            </div>
            <div class="upload-section">
                <div class="file-upload-wrapper">
                    <input type="file" id="csvFile" accept=".csv,.xlsx,.xls" onchange="handleFileUpload(event)">
                    <label for="csvFile" class="file-upload-label">
                        📤 Upload New Data
                    </label>
                </div>
                <button class="file-upload-label" onclick="exportCsv()">
                    ⬇️ Export CSV
                </button>
            </div>
        </div>



        <div class="controls">
            <input type="text" id="searchVehicle" placeholder="🔍 Search Vehicle ID..." oninput="filterTable()">
            <input type="text" id="searchCenter" placeholder="🏢 Search Center Code..." oninput="filterTable()">
            <select id="filterStatus15" onchange="filterTable()">
                <option value="">All Status (15-20th)</option>
                <option value="Locked">Locked</option>
                <option value="Unlocked">Unlocked</option>
                <option value="No Data">No Data</option>
            </select>
            <select id="filterStatus21" onchange="filterTable()">
                <option value="">All Status (21st)</option>
                <option value="Locked">Locked</option>
                <option value="Unlocked">Unlocked</option>
                <option value="No Data">No Data</option>
            </select>
            <button onclick="resetFilters()">🔄 Reset Filters</button>
        </div>

        <div id="messageArea"></div>

        <div class="table-container">
            <div class="table-header">
                <h2>Vehicle Status Overview</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Vehicle ID</th>
                        <th>Center Code</th>
                        <th>Last Location</th>
                        <th>Status (15-20th)</th>
                        <th>Status (21st)</th>
                        <th>Last Updated</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                    <tr>
                        <td colspan="6" class="loading">
                            <div class="loading-spinner"></div>
                            Loading data...
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination" id="pagination" style="display: none;">
                <button onclick="previousPage()">← Previous</button>
                <span class="page-info" id="pageInfo">Page 1</span>
                <button onclick="nextPage()">Next →</button>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 50;
        let activeDetailsRowId = null; // Track which details row is open

        // Load JSON data when page loads - this is now explicitly called after upload or via a new "Load Data" button
        async function loadData() {
            try {
                const response = await fetch('lockview_data.json');
                const jsonData = await response.json();
                
                allData = jsonData.vehicles;
                filteredData = allData;
                
                // Update statistics (removed as per user request)
                
                // Display table
                displayTable();
                
                showMessage('Data loaded successfully! Showing ' + allData.length + ' vehicles.', 'success');
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('dataTable').innerHTML = `
                    <tr>
                        <td colspan="6" class="loading">
                            ⚠️ No data file found. Please upload a CSV file to get started.
                        </td>
                    </tr>
                `;
            }
        }

        function displayTable() {
            const tbody = document.getElementById('dataTable');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredData.slice(start, end);
            
            if (pageData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="loading">
                            No vehicles match your filters.
                        </td>
                    </tr>
                `;
                document.getElementById('pagination').style.display = 'none';
                return;
            }
            
            tbody.innerHTML = pageData.map(vehicle => `
                <tr id="vehicle-row-${vehicle.vehicle_id}" onclick="toggleVehicleDetails('${vehicle.vehicle_id}')">
                    <td class="vehicle-id">${vehicle.vehicle_id}</td>
                    <td>${vehicle.center_id || 'N/A'}</td>
                    <td>${truncateLocation(vehicle.last_location)}</td>
                    <td>${formatStatus(vehicle.status_15_20)}</td>
                    <td>${formatStatus(vehicle.status_21)}</td>
                    <td>${vehicle.last_updated || 'N/A'}</td>
                </tr>
                <tr id="details-row-${vehicle.vehicle_id}" class="vehicle-details-row" style="display: none;">
                    <td colspan="6">
                        <div class="timeline-container">
                            <!-- Timeline content will be injected here -->
                        </div>
                    </td>
                </tr>
            `).join('');
            
            // Update pagination
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('pagination').style.display = totalPages > 1 ? 'flex' : 'none';
        }

        function formatStatus(status) {
            const className = getStatusClass(status);
            return `<span class="status-badge ${className}">${status}</span>`;
        }

        function getStatusClass(status) {
            if (!status || status === 'No Data') return 'status-nodata';
            if (status === 'Locked') return 'status-locked';
            if (status === 'Unlocked') return 'status-unlocked';
            return 'status-unknown';
        }

        function truncateLocation(location) {
            if (!location || location === 'Unknown') return location;
            return location.length > 60 ? location.substring(0, 60) + '...' : location;
        }

        function filterTable() {
            const searchText = document.getElementById('searchVehicle').value.toLowerCase();
            const searchCenter = document.getElementById('searchCenter').value.toLowerCase();
            const status15Filter = document.getElementById('filterStatus15').value;
            const status21Filter = document.getElementById('filterStatus21').value;
            
            filteredData = allData.filter(vehicle => {
                const matchesSearch = vehicle.vehicle_id.toLowerCase().includes(searchText);
                const matchesCenter = !searchCenter || (vehicle.center_id && vehicle.center_id.toLowerCase().includes(searchCenter));
                const matchesStatus15 = !status15Filter || vehicle.status_15_20 === status15Filter;
                const matchesStatus21 = !status21Filter || vehicle.status_21 === status21Filter;
                
                return matchesSearch && matchesCenter && matchesStatus15 && matchesStatus21;
            });
            
            currentPage = 1;
            displayTable();
        }

        function resetFilters() {
            document.getElementById('searchVehicle').value = '';
            document.getElementById('searchCenter').value = '';
            document.getElementById('filterStatus15').value = '';
            document.getElementById('filterStatus21').value = '';
            filterTable();
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                displayTable();
            }
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                displayTable();
            }
        }

        function showMessage(message, type = 'success') {
            const messageArea = document.getElementById('messageArea');
            messageArea.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 5000);
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            showMessage('Uploading and processing CSV...', 'info'); // Add an info message for upload progress

            try {
                const response = await fetch('/upload_csv', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok) {
                    showMessage(result.message, 'success');
                    await loadData(); // Reload data after successful upload
                } else {
                    showMessage(result.error || 'Unknown error during upload.', 'error');
                }
            } catch (error) {
                console.error('Error during file upload:', error);
                showMessage('Network error or server unreachable during upload.', 'error');
            } finally {
                // Reset the file input value so the same file can be uploaded again
                event.target.value = '';
            }
        }

        function toggleVehicleDetails(vehicleId) {
            const detailRow = document.getElementById(`details-row-${vehicleId}`);
            if (detailRow.style.display === 'none') {
                // Hide any previously open details row
                if (activeDetailsRowId && activeDetailsRowId !== vehicleId) {
                    document.getElementById(`details-row-${activeDetailsRowId}`).style.display = 'none';
                }

                // Show details for the clicked row
                detailRow.style.display = 'table-row';
                const vehicle = allData.find(v => v.vehicle_id === vehicleId);
                if (vehicle && vehicle.logs && vehicle.logs.length > 0) {
                    const timelineHtml = vehicle.logs.map(log => `
                        <div class="timeline-item">
                            <div class="timeline-date">${log.timestamp}</div>
                            <div class="timeline-status">${formatStatus(log.status)}</div>
                            <div class="timeline-message">${log.message}</div>
                            <div class="timeline-location">${truncateLocation(log.location)}</div>
                        </div>
                    `).join('');
                    detailRow.querySelector('.timeline-container').innerHTML = timelineHtml;
                } else {
                    detailRow.querySelector('.timeline-container').innerHTML = '<p>No detailed logs available for this vehicle.</p>';
                }
                activeDetailsRowId = vehicleId;
            } else {
                // Hide details
                detailRow.style.display = 'none';
                activeDetailsRowId = null;
            }
        }

        async function exportCsv() {
            try {
                const response = await fetch('/export_csv');
                if (!response.ok) {
                    const error = await response.json();
                    showMessage(error.error || 'Failed to export CSV.', 'error');
                    return;
                }
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'lockview_dashboard_export.csv';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                showMessage('CSV export started!', 'success');
            } catch (error) {
                console.error('Error during CSV export:', error);
                showMessage('Network error or server unreachable during CSV export.', 'error');
            }
        }

        // Initial load is now triggered by explicit upload or button click.
        // window.onload = function() {
        //     loadData();
        // };
    </script>
</body>
</html>
